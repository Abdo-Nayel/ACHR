# =============================================================================
# pytest + coverage configuration for the backend test suite.
#
# setup.cfg rather than pytest.ini because coverage's own settings live here
# too ([coverage:run] / [coverage:report]); pytest.ini can only hold [pytest],
# which would mean two config files disagreeing about what "the suite" is.
#
# Run it from this directory:
#
#     cd backend && pytest
#     cd backend && pytest tests/test_ledger_invariants.py -k allocate
#
# pytest determines its rootdir from the directory it is invoked in, so a run
# started at the repository root will not pick this file up. See
# docs/08-testing-strategy.md.
# =============================================================================

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev

# ``apps`` and ``config`` are imported as top-level packages everywhere in this
# codebase (``from apps.accounting...``), which requires ``backend/`` on
# sys.path. base.py also inserts it, but that happens too late for conftest
# collection.
pythonpath = .

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers: an unregistered marker is a typo, and a typo'd marker is a
#   test that silently never runs — the worst possible failure for a suite
#   whose job is to prove money moves correctly.
# --strict-config: the same rule for this file.
# -ra: show the reason for every skip/xfail, so a skipped RLS assertion is
#   visible in CI output rather than looking like a pass.
addopts =
    --strict-markers
    --strict-config
    -ra
    --durations=10
    --tb=short

markers =
    rls: asserts a PostgreSQL Row-Level Security policy or trigger; skipped automatically on any other backend.
    property: hypothesis-driven property test; slower and non-deterministic in its inputs by design.
    slow: takes more than a second; excluded from the pre-commit subset with -m "not slow".
    integration: crosses a module boundary (payroll -> ledger, sales -> ledger).
    smoke: the minimal set that must pass before a deploy proceeds.

# A warning from our own code is a defect; a warning from a dependency is
# noise we do not control. Errors on the former, ignore the latter explicitly.
filterwarnings =
    error::DeprecationWarning:apps.*
    error::PendingDeprecationWarning:apps.*
    ignore::DeprecationWarning:django.*
    ignore::DeprecationWarning:pkg_resources.*

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
# The gate lives in the Makefile (``--cov-fail-under=85``) rather than here, so
# that a developer running a single file locally is not told their one test
# failed to cover the whole product.

[coverage:run]
branch = True
source = apps
omit =
    */migrations/*
    */tests/*
    */management/commands/seed_demo_tenant.py
    apps/*/apps.py
    */__init__.py

[coverage:report]
show_missing = True
skip_covered = False
precision = 1
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
    def __str__
    def __repr__
    \.\.\.

[coverage:html]
directory = .coverage_html
